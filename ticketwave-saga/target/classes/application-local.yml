spring:
  datasource:
    url: jdbc:h2:mem:ticketwave;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  h2:
    console:
      enabled: true
      path: /h2-console